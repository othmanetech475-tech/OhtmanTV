name: Build APK

on:
  push:
    paths-ignore:
      - 'channels.json'
      - 'logos/**'
      - 'matches.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip newest project zip
        run: |
          ZIP=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Using: $ZIP"
          rm -rf ohtmanTV
          unzip -q "$ZIP"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ohtmanTV
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      # يعرض أخطاء الكود في أعلى صفحة النتيجة (Annotations)
      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e: ' ohtmanTV/build.log | sed -E 's#file:///[^ ]*/ohtmanTV/##' | head -15 | while IFS= read -r line; do echo "::error::$line"; done

      - uses: actions/upload-artifact@v4
        with:
          name: ohtmanTV-apk
          path: ohtmanTV/app/build/outputs/apk/debug/*.apk
