name: Build APK
on:
  push:
    paths-ignore:
      - 'channels.json'
      - 'logos/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ohtmanTV.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: ohtmanTV
      - uses: actions/upload-artifact@v4
        with:
          name: ohtmanTV-apk
          path: ohtmanTV/app/build/outputs/apk/debug/*.apk
